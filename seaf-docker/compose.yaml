services:
  seaf:
    image: seaf-local:2026.33.0-workbench
    container_name: seaf-archtool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VUE_APP_DOCHUB_APPEND_DOCHUB_DOCS: "n"
      VUE_APP_DOCHUB_BACKEND_PORT: "8080"
      VUE_APP_DOCHUB_DATALAKE_CACHE: "memory"
      VUE_APP_DOCHUB_TITLE: "SEAF.ArchTool"
      VUE_APP_DOCHUB_ROOT_MANIFEST: "workspace/root.yaml"
    volumes:
      - type: bind
        source: ./workspace
        target: /var/www/public/workspace
  drawio:
    image: jgraph/drawio@sha256:8a25d78e91275a7ebc0cfcca782a5eb357292752c9c886286448d6951db684e2
    container_name: seaf-drawio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
