  demo.shop.services:
    title: Каталог микросервисов
    location: ShopFlow/02. Каталог микросервисов
    type: table
    headers:
      - { value: service, text: Сервис, link: link }
      - { value: owner, text: Команда }
      - { value: responsibility, text: Назначение }
    source: >
      ([components.$spread().(
        $id := $keys()[0];
        $c := $lookup($, $id);
        $substring($id, 0, 10) = 'demo.shop.' and $c.kind = 'microservice' ? {
          "service": $c.title,
          "owner": $c.owner,
          "responsibility": $c.description,
          "link": "/entities/components/blank?dh-component-id=" & $id
        }
      )])
