server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # HTML и конфигурационные файлы проверяются на актуальность при каждом запросе.
    location / {
        expires off;
        add_header Cache-Control "no-cache" always;
        try_files \$uri \$uri/ /index.html =404;
    }

    # У сборки есть файлы без хеша в имени (например, app.js и runtime.js).
    # Разрешаем хранить их в кеше, но требуем проверять актуальность перед использованием.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "no-cache" always;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}